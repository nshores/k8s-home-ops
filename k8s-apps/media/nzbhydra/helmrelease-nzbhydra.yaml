apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nzbhydra2
  namespace: home
spec:
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts/
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  interval: 15m
  timeout: 5m
  releaseName: nzbhydra2
  values:
    controllers:
      nzbhydra2:
        strategy: Recreate
        containers:
          app:
            image:
              # -- image repository
              repository: linuxserver/nzbhydra2
              # -- image tag
              tag: v7.3.0-ls17
              # -- image pull policy
              pullPolicy: IfNotPresent

            # -- environment variables.
            env:
              # -- Set the container timezone
              TZ: America/Los_Angeles
              # HOST_WHITELIST_ENTRIES:

            probes:
              liveness: &probe
                custom: true
                enabled: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /actuator/health/ping
                    port: 5076
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
              readiness: *probe
              startup: *probe

    service:
      app:
        controller: nzbhydra2
        ports:
          http:
            port: 5076

    ingress:
      app:
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
        hosts:
          - host: nzbhydra.lab.nickshores.net
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http

    # -- Configure persistence settings for the chart under this key.
    persistence:
      config:
        type: persistentVolumeClaim
        # Keep the PVC name from the old k8s-at-home chart so Helm adopts
        # the existing volume instead of replacing it.
        forceRename: nzbhydra2-config
        accessMode: ReadWriteOnce
        size: 20Gi
        retain: true
        globalMounts:
          - path: /config
